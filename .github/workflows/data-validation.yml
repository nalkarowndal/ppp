name: Static Data Validation
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate game data
        run: python scripts/validate_data.py
      - name: Check physical Android QA harness syntax and parser only (no device)
        run: |
          python -m py_compile scripts/qa/android_physical_device_qa.py
          python scripts/qa/android_physical_device_qa.py --self-test
          python -m unittest discover -s tests -p 'test_android_physical_device_qa.py' -v
