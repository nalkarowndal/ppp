name: M1 Android Debug APK Export
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Godot 4.7.2 Linux editor
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Setup Android SDK and CI debug-only signing
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK required}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/ci-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Prepare official Android debug export template
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/export_templates.tpz"
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          archive_entry="$(unzip -Z1 "$RUNNER_TEMP/export_templates.tpz" | grep -m1 -E '(^|/)android_debug.apk$')"
          test -n "$archive_entry"
          unzip -p "$RUNNER_TEMP/export_templates.tpz" "$archive_entry" > "$template_dir/android_debug.apk"
          test -s "$template_dir/android_debug.apk"
          echo "4.7.2.stable" > "$template_dir/version.txt"
          ls -lh "$template_dir/android_debug.apk"
          rm "$RUNNER_TEMP/export_templates.tpz"
      - name: Configure SDK paths in Godot and export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds qa_artifacts
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee qa_artifacts/import.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script res://tests/configure_android_ci.gd 2>&1 | tee qa_artifacts/configure.log
          grep -Fq "ANDROID CONFIG PASS:" qa_artifacts/configure.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" "builds/astral-chronicle-m1-debug.apk" 2>&1 | tee qa_artifacts/export.log
          test -s "builds/astral-chronicle-m1-debug.apk"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' qa_artifacts/export.log; then
            exit 1
          fi
          sha256sum "builds/astral-chronicle-m1-debug.apk" | tee qa_artifacts/apk.sha256
      - name: Validate Android debug signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="builds/astral-chronicle-m1-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk" | tee qa_artifacts/apksigner.log
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk" | tee qa_artifacts/aapt-badging.log
          grep -q "org.astralchronicle.prototype" qa_artifacts/aapt-badging.log
          unzip -l "$apk" | grep -q "lib/arm64-v8a/"
          echo "ANDROID M1 APK EXPORT PASS"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astral-chronicle-m1-android-debug-apk
          path: builds/astral-chronicle-m1-debug.apk
          retention-days: 14
      - name: Upload Android build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astral-chronicle-m1-android-build-logs
          path: qa_artifacts/
          if-no-files-found: ignore
          retention-days: 14
