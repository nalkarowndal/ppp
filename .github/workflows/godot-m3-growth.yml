name: Godot M3 Growth
on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [main, "feature/m2-5-battle-ui"]

permissions:
  contents: read

jobs:
  m3-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa_artifacts
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee qa_artifacts/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' qa_artifacts/import.log; then exit 1; fi
      - name: Run M3-1 growth transaction suite
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_growth_test.gd 2>&1 | tee qa_artifacts/m3_growth.log
          grep -Fq "M3-1 GROWTH PASS:" qa_artifacts/m3_growth.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' qa_artifacts/m3_growth.log; then exit 1; fi
      - name: Run M3-2 equipment and enhancement suite
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_equipment_test.gd 2>&1 | tee qa_artifacts/m3_equipment.log
          grep -Fq "M3-2 EQUIPMENT PASS:" qa_artifacts/m3_equipment.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' qa_artifacts/m3_equipment.log; then exit 1; fi
      - name: Run M3-3 economy and inventory ledger tests
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_economy_inventory_test.gd 2>&1 | tee qa_artifacts/m3_economy.log
          grep -Fq "M3-3 ECONOMY PASS:" qa_artifacts/m3_economy.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' qa_artifacts/m3_economy.log; then exit 1; fi
      - name: Run M3-4 idle reward and replay protection suite
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_offline_rewards_test.gd 2>&1 | tee qa_artifacts/m3_offline.log
          grep -Fq "M3-4 IDLE PASS:" qa_artifacts/m3_offline.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' qa_artifacts/m3_offline.log; then exit 1; fi
      - name: Run M3-5 disk-save backup, migration, and ledger integration tests
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_profile_save_test.gd 2>&1 | tee qa_artifacts/m3_save.log
          grep -Fq "M3-5 SAVE PASS:" qa_artifacts/m3_save.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|M3-5 FAIL:' qa_artifacts/m3_save.log; then exit 1; fi
      - name: Run M3-5 save in three separate Godot processes
        shell: bash
        run: |
          set -euo pipefail
          for phase in write read verify; do
            Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_save_process_test.gd -- "$phase" 2>&1 | tee "qa_artifacts/m3_save_process_${phase}.log"
            grep -Fq "M3-5 PROCESS ${phase^^} PASS:" "qa_artifacts/m3_save_process_${phase}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|M3-5 PROCESS FAIL:' "qa_artifacts/m3_save_process_${phase}.log"; then exit 1; fi
          done
      - name: Run M3-6 progression screen transaction controller suite
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_ui_controller_test.gd 2>&1 | tee qa_artifacts/m3_ui_controller.log
          grep -Fq "M3-6 CONTROLLER PASS:" qa_artifacts/m3_ui_controller.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|M3-6 FAIL:' qa_artifacts/m3_ui_controller.log; then exit 1; fi
      - name: Verify M3 hardware QA blocker regression (unclaimed offline reward)
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_pending_idle_lifecycle_test.gd 2>&1 | tee qa_artifacts/m3_device_gate.log
          grep -Fq "M3 REAL-DEVICE GATE PASS:" qa_artifacts/m3_device_gate.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|M3 REAL-DEVICE GATE FAIL:' qa_artifacts/m3_device_gate.log; then exit 1; fi
      - name: Run M3-6 portrait UI integration suite
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/m3_ui_integration_test.gd 2>&1 | tee qa_artifacts/m3_ui.log
          grep -Fq "M3-6 UI PASS:" qa_artifacts/m3_ui.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|M3-6 UI FAIL:' qa_artifacts/m3_ui.log; then exit 1; fi
      - name: Validate non-destructive physical Android QA harness syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/qa/m3_android_arm64_physical_qa.sh
          bash scripts/qa/m3_android_arm64_physical_qa.sh --validate-only
      - name: Prepare Xvfb portrait UI renderer and Korean font
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk xvfb libgl1-mesa-dri
          fc-cache -f
          fc-match "Noto Sans CJK KR"
      - name: Capture three M3-6 tabs at portrait resolutions
        shell: bash
        run: |
          set -euo pipefail
          for size in 360x800 480x960; do
            for phase in growth equipment idle; do
              M3_6_VISUAL_SIZE="$size" M3_6_VISUAL_PHASE="$phase" LIBGL_ALWAYS_SOFTWARE=1 \
                xvfb-run -a -s "-screen 0 1280x1920x24" \
                timeout 90s Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path . --quit-after 180 --script res://tests/m3_ui_visual_capture.gd 2>&1 \
                | tee "qa_artifacts/m3_6_visual_${size}_${phase}.log"
              grep -Fq "M3-6 VISUAL CAPTURE PASS:" "qa_artifacts/m3_6_visual_${size}_${phase}.log"
              if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|M3-6 VISUAL FAIL:' "qa_artifacts/m3_6_visual_${size}_${phase}.log"; then exit 1; fi
              test -s "qa_artifacts/m3_6_ui_${size}_${phase}.png"
            done
          done
      - name: Upload M3-6 rendered UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-6-growth-equipment-idle-portraits
          path: qa_artifacts/m3_6_ui_*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload M3 growth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-1-growth-logs
          path: qa_artifacts/
          if-no-files-found: ignore
